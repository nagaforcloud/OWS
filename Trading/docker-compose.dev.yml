version: '3.8'

services:
  trading-bot-dev:
    build: .
    container_name: options-wheel-trading-bot-dev
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - ENVIRONMENT=development
    restart: unless-stopped
    networks:
      - trading-network
    command: >
      sh -c "
      pip install -e .
      streamlit run dashboard/dashboard.py
      "